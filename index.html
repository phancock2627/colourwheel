<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watercolor Color Wheel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/color-thief@2.4.0/dist/color-thief.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow-y: scroll;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #ideal-swatch-container {
            display: none;
        }
        .swatch {
            min-height: 100px;
            touch-action: none;
        }
        .action-btn, .picker-btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            z-index: 30000;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            position: relative;
            pointer-events: auto;
            outline: none;
            touch-action: manipulation;
        }
        .action-btn {
            background-color: #2563eb;
            color: white;
        }
        .picker-btn {
            background-color: #e5e7eb;
            border: 1px solid #ccc;
            color: #374151;
        }
        .action-btn:hover {
            background-color: #1d4ed8;
        }
        .picker-btn:hover {
            background-color: #d1d5db;
        }
        .action-btn:active, .picker-btn:active {
            transform: scale(0.98);
        }
        @media (max-width: 640px) {
            #swatch-container, #ideal-swatch-container {
                grid-template-columns: 1fr;
            }
            .p-4 {
                padding: 0.5rem;
            }
            .swatch {
                min-height: 80px;
            }
            .action-btn, .picker-btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center p-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Watercolor Color Wheel</h1>
    <p class="text-gray-600 mb-4 text-center">Tap a color or use the buttons below to analyze an image. Toggle ideal colors below.</p>
    
    <div class="flex flex-col sm:flex-row gap-4 mb-4">
        <button id="camera-btn" class="picker-btn text-center">Take Photo</button>
        <input type="file" id="camera-picker" accept="image/*" capture="environment">
        <button id="gallery-btn" class="picker-btn text-center">Choose Image</button>
        <input type="file" id="gallery-picker" accept="image/*">
        <button id="confirm-image" class="picker-btn hidden">Confirm Image</button>
    </div>
    
    <div id="canvas-container" class="mb-4"></div>
    <button id="ideal-swatch-btn" class="hidden mb-4 action-btn" aria-label="Toggle ideal color swatch">View Ideal Color Swatch</button>
    <div id="swatch-container" class="grid grid-cols-2 gap-4 w-full max-w-md mb-4"></div>
    <div id="ideal-swatch-container" class="grid grid-cols-2 gap-4 w-full max-w-md"></div>

    <script>
        // Watercolor palette
        const watercolorColors = [
            { name: "Cobalt Blue", brand: "Daniel Smith", pigment: "PB28", hue: 240, rgb: [0, 51, 153], shadow: "Warm Grey Orange" },
            { name: "Cerulean Blue", brand: "Winsor & Newton", pigment: "PB35", hue: 210, rgb: [0, 110, 200], shadow: "Warm Grey Brown" },
            { name: "Cobalt Turquoise Light", brand: "Daniel Smith", pigment: "PB36", hue: 180, rgb: [0, 160, 160], shadow: "Warm Grey" },
            { name: "Purple Lake", brand: "Winsor & Newton", pigment: "PV19", hue: 300, rgb: [120, 0, 120], shadow: "Warm Grey Yellow" },
            { name: "Indian Yellow", brand: "Winsor & Newton", pigment: "PY139", hue: 50, rgb: [255, 180, 0], shadow: "Cool Blueish Purple" },
            { name: "Jaune Brilliant", brand: "Holbein", pigment: "PW6/PY3", hue: 60, rgb: [255, 200, 100], shadow: "Cool Grey Purple" },
            { name: "Yellow Ochre", brand: "Daniel Smith", pigment: "PY43", hue: 45, rgb: [204, 153, 0], shadow: "Cool Blueish Grey" },
            { name: "Burnt Sienna", brand: "Winsor & Newton", pigment: "PBr7", hue: 15, rgb: [204, 85, 0], shadow: "Cool Blueish Grey" },
            { name: "Scarlet Lake", brand: "Holbein", pigment: "PR188", hue: 10, rgb: [220, 60, 60], shadow: "Cool Grey Green" },
            { name: "Pyrrol Orange", brand: "Daniel Smith", pigment: "PO73", hue: 30, rgb: [255, 102, 0], shadow: "Cool Grey Blue" },
            { name: "Rose Madder Permanent", brand: "Daniel Smith", pigment: "PR209", hue: 330, rgb: [204, 0, 102], shadow: "Cool Grey Green" },
            { name: "Green Gold", brand: "Winsor & Newton", pigment: "PY129", hue: 90, rgb: [153, 204, 0], shadow: "Warm Grey Red" },
            { name: "Sap Green", brand: "Winsor & Newton", pigment: "PG36/PY110", hue: 100, rgb: [100, 150, 0], shadow: "Warm Grey Red" },
            { name: "Viridian", brand: "Winsor & Newton", pigment: "PG18", hue: 120, rgb: [0, 140, 0], shadow: "Warm Grey Red" }
        ];

        // Ideal color RGBs
        const idealColorRGBs = {
            "Bright Orange": [255, 128, 0],
            "Warm Orange": [255, 165, 0],
            "Bright Red": [255, 0, 0],
            "Vivid Green": [0, 128, 0],
            "Cool Purple": [128, 0, 128],
            "Bright Cyan": [0, 255, 255],
            "Deep Blue": [0, 0, 139],
            "Cool Blue": [0, 0, 255],
            "Bright Yellow": [255, 255, 0],
            "Cool Cyan": [0, 139, 139],
            "Warm Grey": [139, 139, 139],
            "Warm Grey Orange": [139, 120, 100],
            "Warm Grey Brown": [139, 100, 80],
            "Warm Grey Yellow": [139, 139, 100],
            "Cool Blueish Purple": [100, 100, 139],
            "Cool Grey Purple": [120, 120, 139],
            "Cool Blueish Grey": [120, 120, 139],
            "Cool Grey Green": [100, 139, 120],
            "Cool Grey Blue": [100, 120, 139],
            "Bright Green": [0, 255, 0],
            "Neutral": [139, 139, 139]
        };

        // Ideal colors
        const idealColors = {
            240: { comp: "Bright Orange", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Cool Cyan", ana2: "Deep Blue", shadow: "Warm Grey Orange" },
            210: { comp: "Warm Orange", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Cyan", ana2: "Deep Blue", shadow: "Warm Grey Brown" },
            180: { comp: "Bright Red", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Cyan", ana2: "Cool Blue", shadow: "Warm Grey" },
            300: { comp: "Bright Yellow", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Cool Blue", ana2: "Bright Red", shadow: "Warm Grey Yellow" },
            50: { comp: "Cool Purple", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Warm Orange", shadow: "Cool Blueish Purple" },
            60: { comp: "Cool Purple", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Warm Orange", shadow: "Cool Grey Purple" },
            45: { comp: "Cool Blue", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Warm Orange", shadow: "Cool Blueish Grey" },
            15: { comp: "Cool Blue", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Warm Orange", ana2: "Bright Red", shadow: "Cool Blueish Grey" },
            10: { comp: "Cool Green", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Warm Orange", ana2: "Bright Red", shadow: "Cool Grey Green" },
            30: { comp: "Cool Blue", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Bright Red", shadow: "Cool Grey Blue" },
            330: { comp: "Bright Green", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Red", ana2: "Cool Purple", shadow: "Cool Grey Green" },
            90: { comp: "Bright Red", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Vivid Green", shadow: "Warm Grey Red" },
            100: { comp: "Bright Red", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Bright Yellow", ana2: "Vivid Green", shadow: "Warm Grey Red" },
            120: { comp: "Bright Red", sec1: "Vivid Green", sec2: "Warm Orange", sec3: "Cool Purple", ana1: "Vivid Green", ana2: "Cool Cyan", shadow: "Warm Grey Red" }
        };

        let currentColors = watercolorColors;
        let selectedColorIndex = null;
        let isIdealSwatchVisible = false;
        let lastToggleTime = 0;
        let selectedFile = null;
        let isCameraImage = false;

        // Toggle ideal swatch visibility
        window.toggleIdealSwatch = function(index) {
            const now = Date.now();
            if (now - lastToggleTime < 300) return;
            lastToggleTime = now;
            try {
                const idealSwatchContainer = document.getElementById('ideal-swatch-container');
                const idealBtn = document.getElementById('ideal-swatch-btn');
                isIdealSwatchVisible = !isIdealSwatchVisible;
                idealSwatchContainer.style.display = isIdealSwatchVisible ? 'grid' : 'none';
                idealBtn.textContent = isIdealSwatchVisible ? 'Hide Ideal Color Swatch' : 'View Ideal Color Swatch';
                if (isIdealSwatchVisible && index !== null) {
                    displayIdealSwatch(index);
                }
            } catch (err) {
                console.error('Error toggling ideal swatch:', err);
                alert('Error toggling ideal swatches.');
            }
        };

        // p5.js setup
        function setup() {
            const canvasSize = Math.min(window.innerWidth * 0.9, 350);
            const canvas = createCanvas(canvasSize, canvasSize);
            canvas.parent('canvas-container');
            canvas.elt.setAttribute('aria-label', 'Interactive watercolor color wheel');
            colorMode(HSB, 360, 100, 100);
            drawColorWheel();
        }

        function drawColorWheel() {
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width * 0.4;
            const angleStep = 360 / currentColors.length;
            for (let i = 0; i < currentColors.length; i++) {
                const startAngle = radians(i * angleStep);
                const endAngle = radians((i + 1) * angleStep);
                fill(currentColors[i].hue, 80, 80);
                arc(centerX, centerY, radius * 2, radius * 2, startAngle, endAngle, PIE);
            }
        }

        function mousePressed() {
            handleColorSelection();
        }

        function touchStarted() {
            handleColorSelection();
            return false;
        }

        function handleColorSelection() {
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width * 0.4;
            const d = dist(mouseX, mouseY, centerX, centerY);
            if (d <= radius) {
                let angle = atan2(mouseY - centerY, mouseX - centerX);
                if (angle < 0) angle += TWO_PI;
                const index = Math.floor(degrees(angle) / (360 / currentColors.length)) % currentColors.length;
                selectedColorIndex = index;
                displaySwatch(index);
                document.getElementById('ideal-swatch-btn').classList.remove('hidden');
            }
        }

        function processImage(file, source) {
            try {
                selectedFile = file;
                isCameraImage = source === 'camera';
                document.getElementById('confirm-image').classList.remove('hidden');
            } catch (err) {
                console.error('Error processing image:', err);
                alert('Error selecting image. Please try again.');
            }
        }

        function confirmImage() {
            if (!selectedFile) {
                alert('No image selected. Please try again.');
                return;
            }
            try {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        if (typeof ColorThief === 'undefined') {
                            alert('Color picker not loaded. Please refresh.');
                            return;
                        }
                        analyzeImage(img);
                        if (isCameraImage) {
                            const fileName = `colorwheel_photo_${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
                            const link = document.createElement('a');
                            link.href = e.target.result;
                            link.download = fileName;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        }
                    };
                    img.onerror = () => {
                        alert('Failed to load image. Please select another.');
                    };
                };
                reader.onerror = () => {
                    alert('Error reading image. Please try again.');
                };
                reader.readAsDataURL(selectedFile);
                document.getElementById('confirm-image').classList.add('hidden');
                selectedFile = null;
            } catch (err) {
                console.error('Error confirming image:', err);
                alert('Error confirming image. Please try again.');
            }
        }

        function analyzeImage(img) {
            try {
                const colorThief = new ColorThief();
                const dominantColor = colorThief.getColor(img);
                const closestColorIndex = findClosestColor(dominantColor);
                selectedColorIndex = closestColorIndex;
                displaySwatch(closestColorIndex);
                document.getElementById('ideal-swatch-btn').classList.remove('hidden');
            } catch (err) {
                console.error('Error analyzing image:', err);
                alert('Failed to analyze image colors. Please try again.');
            }
        }

        function findClosestColor(rgb) {
            let minDist = Infinity;
            let closestIndex = 0;
            currentColors.forEach((color, index) => {
                const dist = Math.sqrt(
                    (color.rgb[0] - rgb[0]) ** 2 +
                    (color.rgb[1] - rgb[1]) ** 2 +
                    (color.rgb[2] - rgb[2]) ** 2
                );
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = index;
                }
            });
            return closestIndex;
        }

        function getContrastColor(rgb) {
            const luminance = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
            return luminance > 0.5 ? [0, 0, 0] : [255, 255, 255];
        }

        function displaySwatch(index) {
            try {
                const selectedColor = currentColors[index];
                const swatchContainer = document.getElementById('swatch-container');
                swatchContainer.innerHTML = '';
                const compIndex = (index + Math.floor(currentColors.length / 2)) % currentColors.length;
                const compColor = currentColors[compIndex];
                const secondaryColors = [
                    currentColors.find(c => c.name.includes("Green") || c.name.includes("Viridian")) || currentColors.find(c => c.hue >= 90 && c.hue <= 120),
                    currentColors.find(c => c.name.includes("Yellow") || c.name.includes("Orange") || c.name.includes("Sienna")) || currentColors.find(c => c.hue >= 15 && c.hue <= 60),
                    currentColors.find(c => c.name.includes("Purple") || c.name.includes("Rose") || c.name.includes("Lake")) || currentColors.find(c => c.hue >= 300 && c.hue <= 330)
                ].filter(c => c);
                const analog1Index = (index - 1 + currentColors.length) % currentColors.length;
                const analog2Index = (index + 1) % currentColors.length;
                const analog1 = currentColors[analog1Index];
                const analog2 = currentColors[analog2Index];
                const swatches = [
                    { label: "Selected", color: selectedColor, rgb: selectedColor.rgb },
                    { label: "Complementary", color: compColor, rgb: compColor.rgb },
                    { label: "Secondary (Green)", color: secondaryColors[0], rgb: secondaryColors[0]?.rgb },
                    { label: "Secondary (Orange/Yellow)", color: secondaryColors[1], rgb: secondaryColors[1]?.rgb },
                    { label: "Secondary (Purple/Rose)", color: secondaryColors[2], rgb: secondaryColors[2]?.rgb },
                    { label: "Analogous 1", color: analog1, rgb: analog1.rgb },
                    { label: "Analogous 2", color: analog2, rgb: analog2.rgb },
                    { label: "Shadow", color: { name: selectedColor.shadow, brand: "" }, rgb: idealColorRGBs[selectedColor.shadow] || [200, 200, 200] }
                ].filter(s => s.rgb || s.label === "Shadow");
                swatches.forEach(swatch => {
                    const rgb = swatch.rgb || [200, 200, 200];
                    const textColor = getContrastColor(rgb);
                    const gradient = `linear-gradient(to bottom, rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 1), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.8), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.6), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.4), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.2))`;
                    const swatchDiv = document.createElement('div');
                    swatchDiv.className = 'p-4 rounded-lg shadow-md swatch';
                    swatchDiv.style.background = gradient;
                    swatchDiv.setAttribute('role', 'region');
                    swatchDiv.setAttribute('aria-label', `${swatch.label}: ${swatch.color.name}`);
                    swatchDiv.innerHTML = `
                        <p class="font-semibold" style="color: rgb(${textColor[0]}, ${textColor[1]}, ${textColor[2]})">${swatch.label}</p>
                        <p style="color: rgb(${textColor[0]}, ${textColor[1]}, ${textColor[2]})">${swatch.color.name} ${swatch.color.brand ? '(' + swatch.color.brand + ')' : ''}</p>
                    `;
                    swatchContainer.appendChild(swatchDiv);
                });
            } catch (err) {
                console.error('Error displaying swatches:', err);
                alert('Error displaying swatches. Please refresh.');
            }
        }

        function displayIdealSwatch(index) {
            try {
                const selectedColor = currentColors[index];
                const idealSwatchContainer = document.getElementById('ideal-swatch-container');
                idealSwatchContainer.innerHTML = '';
                const ideal = idealColors[selectedColor.hue] || {
                    comp: "Neutral", sec1: "Neutral", sec2: "Neutral", sec3: "Neutral", ana1: "Neutral", ana2: "Neutral", shadow: "Neutral"
                };
                const swatches = [
                    { label: "Ideal Complementary", name: ideal.comp },
                    { label: "Ideal Secondary (Green)", name: ideal.sec1 },
                    { label: "Ideal Secondary (Orange)", name: ideal.sec2 },
                    { label: "Ideal Secondary (Purple)", name: ideal.sec3 },
                    { label: "Ideal Analogous 1", name: ideal.ana1 },
                    { label: "Ideal Analogous 2", name: ideal.ana2 },
                    { label: "Ideal Shadow", name: ideal.shadow }
                ];
                swatches.forEach(swatch => {
                    const rgb = idealColorRGBs[swatch.name] || [139, 139, 139];
                    const textColor = getContrastColor(rgb);
                    const gradient = `linear-gradient(to bottom, rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 1), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.8), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.6), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.4), rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.2))`;
                    const swatchDiv = document.createElement('div');
                    swatchDiv.className = 'p-4 rounded-lg shadow-md swatch';
                    swatchDiv.style.background = gradient;
                    swatchDiv.setAttribute('role', 'region');
                    swatchDiv.setAttribute('aria-label', `${swatch.label}: ${swatch.name}`);
                    swatchDiv.innerHTML = `
                        <p class="font-semibold" style="color: rgb(${textColor[0]}, ${textColor[1]}, ${textColor[2]})">${swatch.label}</p>
                        <p style="color: rgb(${textColor[0]}, ${textColor[1]}, ${textColor[2]})">${swatch.name}</p>
                    `;
                    idealSwatchContainer.appendChild(swatchDiv);
                });
            } catch (err) {
                console.error('Error displaying ideal swatches:', err);
                alert('Error displaying ideal swatches. Please refresh.');
            }
        }

        function windowResized() {
            const canvasSize = Math.min(window.innerWidth * 0.9, 350);
            resizeCanvas(canvasSize, canvasSize);
            drawColorWheel();
        }

        // Initialize file input listeners
        function initInputs() {
            try {
                const cameraBtn = document.getElementById('camera-btn');
                const galleryBtn = document.getElementById('gallery-btn');
                const cameraPicker = document.getElementById('camera-picker');
                const galleryPicker = document.getElementById('gallery-picker');
                const confirmBtn = document.getElementById('confirm-image');

                if (!cameraBtn || !galleryBtn || !cameraPicker || !galleryPicker || !confirmBtn) {
                    alert('App initialization failed. Please refresh.');
                    return;
                }

                function triggerInput(input, source) {
                    try {
                        input.click();
                    } catch (err) {
                        console.error(`Error triggering ${input.id}:`, err);
                        alert(`Failed to open ${source}. Please check permissions.`);
                    }
                }

                function addButtonListeners(btn, input, source) {
                    btn.addEventListener('click', () => triggerInput(input, source));
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        triggerInput(input, source);
                    });
                }

                addButtonListeners(cameraBtn, cameraPicker, 'camera');
                addButtonListeners(galleryBtn, galleryPicker, 'gallery');

                cameraPicker.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        processImage(e.target.files[0], 'camera');
                    } else {
                        alert('No image selected from camera.');
                    }
                });

                galleryPicker.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        processImage(e.target.files[0], 'gallery');
                    } else {
                        alert('No image selected from gallery.');
                    }
                });

                confirmBtn.addEventListener('click', confirmImage);
                confirmBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    confirmImage();
                });
            } catch (err) {
                console.error('Error initializing inputs:', err);
                alert('Failed to initialize app. Please refresh.');
            }
        }

        // Initialize app
        window.onload = () => {
            if (typeof ColorThief === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/color-thief@2.4.0/dist/color-thief.umd.min.js';
                script.onload = () => initInputs();
                script.onerror = () => alert('Failed to load color picker. Please refresh.');
                document.head.appendChild(script);
            } else {
                initInputs();
            }

            const idealBtn = document.getElementById('ideal-swatch-btn');
            function handleIdealSwatchClick(e) {
                e.preventDefault();
                if (selectedColorIndex !== null) {
                    window.toggleIdealSwatch(selectedColorIndex);
                } else {
                    alert('Please select a color first.');
                }
            }
            idealBtn.addEventListener('click', handleIdealSwatchClick);
            idealBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleIdealSwatchClick(e);
            });
        };
    </script>
</body>
</html>
